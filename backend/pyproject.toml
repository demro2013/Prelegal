[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for Prelegal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "litellm>=1.108.1",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real model and costs a little credit"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
